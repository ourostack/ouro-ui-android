name: Release

# Push a tag vX.Y.Z that matches gradle.properties' ouro.version (RELEASING.md). This runs the tests, builds the
# libraries' Maven files, attaches them to the GitHub release with the notes in docs/releases/vX.Y.Z.md, and publishes
# every release's Maven files as a static Maven repository on GitHub Pages, which needs no sign-in to read.
# The Pages work is its own jobs, so a deploy that fails (GitHub has twice not shown the uploaded artifact to
# deploy-pages in time, at v0.9.0 and v0.11.0) is rerun alone, without making the release again. Run the workflow by
# hand on main to rebuild the site from the releases that exist and deploy it.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  # id-token also lets GitHub sign which workflow run built each file the release attaches.
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches ouro.version and has notes
        run: |
          v="$(sed -n 's/^ouro.version=//p' gradle.properties)"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but ouro.version is $v. Fix: set ouro.version in a pull request first."; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "::error::no docs/releases/$GITHUB_REF_NAME.md. Fix: write the notes in the version pull request."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, claims and snapshots, then the Maven files
        run: ./gradlew --no-daemon :ouro-actions:testDebugUnitTest :ouro-hx:verifyRoborazziDebug publishAllPublicationsToBuildRepository
      - name: Package
        run: |
          (cd build/maven && zip -qr "../../ouro-ui-android-$GITHUB_REF_NAME-maven.zip" .)
          find build/maven -name "*.aar" -o -name "*.pom" | xargs -I{} cp {} .
      - name: Attest the release's files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ouro-ui-android-${{ github.ref_name }}-maven.zip
            ./*.aar
            ./*.pom
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists, so it is kept as it is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Ouro UI for Android $GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              "ouro-ui-android-$GITHUB_REF_NAME-maven.zip" ./*.aar ./*.pom
          fi

  # Every release's Maven files, as one repository. Runs after a release, or alone by hand.
  site:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Every release's Maven files, as one repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p site/maven old
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern "ouro-ui-android-$tag-maven.zip" --dir old || true
          done
          for z in old/*.zip; do [ -f "$z" ] && unzip -qo "$z" -d site/maven; done
          printf '<!doctype html><meta charset="utf-8"><title>Ouro UI for Android</title><p>Maven repository for <a href="https://github.com/ourostack/ouro-ui-android">ouro-ui-android</a>: <code>maven { url = uri("https://ourostack.github.io/ouro-ui-android/maven") }</code></p>\n' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
